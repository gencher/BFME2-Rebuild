        run: |
          set -euo pipefail
          trap 'rc=$?; printf "Expected %s to finish; found exit %s at shell line %s.\n" "Set exact attempt recovery deadlines" "$rc" "$LINENO" >&2' ERR
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C LC_ALL=C \
            TMPDIR="$RUNNER_TEMP" GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_OUTPUT="$GITHUB_OUTPUT" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REPOSITORY_ID="$GITHUB_REPOSITORY_ID" \
            BFME_RECOVERY_READ_TOKEN="$BFME_RECOVERY_READ_TOKEN" \
            BFME_PR_RUNNER="${BFME_PR_RUNNER:-}" \
            python3 -B ci/managed-check/recovery_broker.py clock "$RUNNER_TEMP/bfme-admission-status"
      - name: Create exact compile plan and shard assignments
        shell: bash
        id: plan
        env:
          MANAGED_WIDE_SHARDS: "${{ vars.BFME_WIDE_SHARDS || '16' }}"
          MANAGED_WIDE_TUS_PER_SHARD: "${{ vars.BFME_WIDE_TUS_PER_SHARD || '32' }}"
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected protected workflow step to finish. Found exit %s at shell line %s.\n" "$rc" "$LINENO" >&2' ERR
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C LC_ALL=C \
            TMPDIR="$RUNNER_TEMP" GITHUB_SHA="$GITHUB_SHA" GITHUB_OUTPUT="$GITHUB_OUTPUT" MANAGED_WIDE_SHARDS="$MANAGED_WIDE_SHARDS" \
            MANAGED_WIDE_TUS_PER_SHARD="$MANAGED_WIDE_TUS_PER_SHARD" \
            BFME_PR_RUNNER="${BFME_PR_RUNNER:-}" \
            python3 -B ci/managed-check/wide.py plan "$RUNNER_TEMP/bfme-plan" "$RUNNER_TEMP/bfme-matrix"
      - name: Save the protected paired plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-matrix-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-matrix/matrix.json'
          if-no-files-found: error
          retention-days: 1

