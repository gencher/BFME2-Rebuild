          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C LC_ALL=C \
            TMPDIR="$RUNNER_TEMP" GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            BFME_PR_RUNNER="${BFME_PR_RUNNER:-}" \
            python3 -B ci/managed-check/wide.py join-selected "$RUNNER_TEMP/bfme-plan" \
              "$RUNNER_TEMP/bfme-matrix" "$PLAN_SHA" "$RUNNER_TEMP/bfme-shards" "$RUNNER_TEMP/bfme-verdict" \
              "$RUNNER_TEMP/bfme-lease/lease.json" "$LEASE_SHA"
      - name: Save complete capped comparison
        id: verdict
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-verdict-wide-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-verdict/verdict.json'
          if-no-files-found: error
          retention-days: 1
      - name: Save selected sanitized advisory groups
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-recovery-selected-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-shards/'
          if-no-files-found: error
          retention-days: 1

      - name: Probe declarations on the admitted header trees
        id: h2_probe
        if: >-
          steps.verdict.outcome == 'success' && vars.BFME_PR_COMPACT == 'yes' &&
          needs.intake.outputs.source_decision != '' &&
          fromJSON(needs.intake.outputs.source_decision).overall == 'success' &&
          (vars.BFME_AUTO_HEADERS == 'yes' ||
           (github.event_name == 'pull_request_target' && github.actor_id == '1760627' &&
            github.event.action == 'labeled' && github.event.label.name == 'boat-ok'))
        continue-on-error: true
        shell: bash
        env:
          BFME_H2_SOURCE: ${{ needs.intake.outputs.source_decision }}
        run: |
          set -euo pipefail
          if ! jq -e '.report.kind == "ok"' "$RUNNER_TEMP/bfme-verdict/verdict.json" >/dev/null ||
             ! jq -e '.changed_paths | any(startswith("include/"))' "$RUNNER_TEMP/bfme-plan/plan.json" >/dev/null; then
            exit 0
          fi
          printf 'attempted=yes\n' >> "$GITHUB_OUTPUT"
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C LC_ALL=C TMPDIR="$RUNNER_TEMP" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            BFME_H2_SOURCE="$BFME_H2_SOURCE" BFME_PR_RUNNER="${BFME_PR_RUNNER:-}" \
            /usr/bin/timeout --kill-after=5s 90s \
            python3 -B ci/managed-check/header_h2_action.py probe "$RUNNER_TEMP/bfme-plan" "$RUNNER_TEMP/bfme-h2"
          test -s "$RUNNER_TEMP/bfme-h2/header-h2.json"
          test "$(wc -c < "$RUNNER_TEMP/bfme-h2/header-h2.json")" -le 131072
          printf 'available=yes\n' >> "$GITHUB_OUTPUT"
      - name: Save the bounded declaration receipt
        id: h2_upload
        if: steps.h2_probe.outputs.available == 'yes'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-header-h2-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-h2/header-h2.json'
          if-no-files-found: error
          retention-days: 1
      - name: Produce bounded trusted header observations
        id: ht_produce
        if: steps.h2_probe.outputs.attempted == 'yes'
        continue-on-error: true
        shell: bash
        env:
          BFME_H2_SOURCE: ${{ needs.intake.outputs.source_decision }}
        run: |
          set -euo pipefail
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C LC_ALL=C TMPDIR="$RUNNER_TEMP" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            BFME_H2_SOURCE="$BFME_H2_SOURCE" BFME_PR_RUNNER="${BFME_PR_RUNNER:-}" \
            /usr/bin/timeout --kill-after=5s 60s \
            python3 -B ci/managed-check/header_trusted_action.py produce "$RUNNER_TEMP/bfme-plan" "$RUNNER_TEMP/bfme-ht"
          test -s "$RUNNER_TEMP/bfme-ht/header-trusted.json"
          test "$(wc -c < "$RUNNER_TEMP/bfme-ht/header-trusted.json")" -le 524288
          printf 'available=yes\n' >> "$GITHUB_OUTPUT"
      - name: Save bounded trusted header observations
        id: ht_upload
        if: steps.ht_produce.outputs.available == 'yes'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-header-trusted-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-ht/header-trusted.json'
          if-no-files-found: error
          retention-days: 1
      - name: Measure header layout on the admitted header trees
        id: h5_wide
        if: >-
          steps.verdict.outcome == 'success' && vars.BFME_PR_COMPACT == 'yes' &&
          needs.intake.outputs.source_decision != '' &&
          fromJSON(needs.intake.outputs.source_decision).overall == 'success' &&
          (vars.BFME_AUTO_HEADERS == 'yes' ||
           (github.event_name == 'pull_request_target' && github.actor_id == '1760627' &&
            github.event.action == 'labeled' && github.event.label.name == 'boat-ok'))
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if ! jq -e '.report.kind == "ok"' "$RUNNER_TEMP/bfme-verdict/verdict.json" >/dev/null ||
             ! jq -e '.changed_paths | any(startswith("include/"))' "$RUNNER_TEMP/bfme-plan/plan.json" >/dev/null; then
            exit 0
          fi
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C LC_ALL=C TMPDIR="$RUNNER_TEMP" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            BFME_PR_RUNNER="${BFME_PR_RUNNER:-}" \
            /usr/bin/timeout --kill-after=5s 420s \
            python3 -B ci/header-witness/h5_wide.py "$RUNNER_TEMP/bfme-plan" "$RUNNER_TEMP/bfme-h5"
          printf 'available=yes\n' >> "$GITHUB_OUTPUT"
      - name: Save the bounded header layout receipt
        if: steps.h5_wide.outputs.available == 'yes'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-header-h5-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-h5/header-h5.json'
          if-no-files-found: error
          retention-days: 1

  inline-virtual:
    needs: [intake, compare, wide-plan, wide-join]
    if: >-
      always() && !cancelled() &&
      ((vars.BFME_PR_COMPACT != 'yes' && needs.compare.outputs.inline_matrix_sha != '') || needs.wide-join.outputs.complete == 'true')
    name: Inline virtual behaviour (report only)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Check out protected evaluator and reference
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
      - name: Read private source admission for this attempt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bfme-plan-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-plan'
      - name: Read private narrow advisory evidence
        if: needs.compare.outputs.inline_matrix_sha != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bfme-inline-narrow-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-inline-narrow'
      - name: Read protected wide matrix for this attempt
        if: needs.wide-join.outputs.complete == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bfme-matrix-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-matrix'
      - name: Read same-attempt compact wide receipts
        if: needs.wide-join.outputs.complete == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bfme-recovery-selected-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-shards'
      - name: Evaluate and render advisory result
        shell: bash
        env:
          NARROW_SHA: '${{ needs.compare.outputs.inline_matrix_sha }}'
          WIDE_SHA: '${{ needs.wide-plan.outputs.matrix_sha }}'
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected protected workflow step to finish. Found exit %s at shell line %s.\n" "$rc" "$LINENO" >&2' ERR
          (cd ci/managed-check && sha256sum -c --quiet bundle.sha256)
          (cd ci/managed-nt2 && sha256sum -c --quiet bundle.sha256)
          dir="$RUNNER_TEMP/bfme-inline-narrow"
          matrix="$dir/matrix.json"
          sha="$NARROW_SHA"
          if test -z "$sha"; then
              dir="$RUNNER_TEMP/bfme-shards"
              matrix="$RUNNER_TEMP/bfme-matrix/matrix.json"
              sha="$WIDE_SHA"
          fi
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C LC_ALL=C TMPDIR="$RUNNER_TEMP" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" BFME_INLINE_OWNER_SCOPE="$BFME_INLINE_OWNER_SCOPE" \
            BFME_PR_RUNNER="${BFME_PR_RUNNER:-}" \
            python3 -B ci/managed-check/managed_inline_action.py "$RUNNER_TEMP/bfme-plan/plan.json" \
              "$matrix" "$dir" "$sha" "$RUNNER_TEMP/bfme-inline-report"
      - name: Retain report-only state and summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-inline-report-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-inline-report'
          if-no-files-found: error
          retention-days: 1

  inline-report:
    needs: [pending, intake, claim, compare, wide-plan, wide-join, inline-virtual]
    if: >-
      always() && !cancelled() && (vars.BFME_PR_COMPACT != 'yes' || needs.intake.outputs.route == 'wide' || (needs.intake.outputs.route == 'automatic-wide' && needs.claim.outputs.allowed == 'yes')) &&
      (vars.BFME_PR_COMPACT == 'yes' || needs.pending.result == 'success') &&
      (needs.intake.outputs.route == 'compile' || needs.intake.outputs.route == 'wide' || (needs.intake.outputs.route == 'automatic-wide' && needs.claim.outputs.allowed == 'yes')) && (needs.wide-plan.result != 'success' || needs.wide-join.outputs.complete == 'true')
    name: Publish inline virtual commit status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check out protected status writer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
          sparse-checkout: ci/managed-check
      - name: Verify protected writer
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected protected workflow step to finish. Found exit %s at shell line %s.\n" "$rc" "$LINENO" >&2' ERR
          (cd ci/managed-check && sha256sum -c --quiet bundle.sha256)
      - name: Read this attempt's sanitized inline status
        id: receipt
        if: needs.inline-virtual.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bfme-inline-report-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-inline-status'
      - name: Read this attempt's source-free admission decision
        if: steps.receipt.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bfme-admission-status-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-admission-status'
      - name: Publish exact-head inline virtual status
        shell: bash
        env:
          BFME_STATUS_TOKEN: '${{ github.token }}'
          RECEIPT: '${{ steps.receipt.outcome }}'
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected protected workflow step to finish. Found exit %s at shell line %s.\n" "$rc" "$LINENO" >&2' ERR
          if [[ "$RECEIPT" == success ]]; then
            path="$RUNNER_TEMP/bfme-inline-status/inline-status.json"
          else
            path="$RUNNER_TEMP/bfme-inline-unavailable/inline-status.json"
          fi
          rc=0
          python3 -B ci/managed-check/inline_status.py "$path" "$RUNNER_TEMP/bfme-admission-status/decision.json" || rc=$?
          if [[ "$rc" == 2 ]]; then
            printf '%s\n' 'Stale measurement: the pull request or protected main moved before publication.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$rc"

  report:
    needs: [pending, intake, claim, compare, wide-plan, wide-join]
    if: always() && !cancelled() && needs.intake.result != 'skipped' && (vars.BFME_PR_COMPACT == 'yes' || (needs.wide-plan.result != 'success' || needs.wide-join.outputs.complete == 'true'))
    name: Report on the pull request head
    outputs:
      stale: ${{ (steps.native.outputs.stale == 'yes' || steps.publish.outputs.stale == 'yes') && 'yes' || 'no' }}
      passed: ${{ steps.native.outcome == 'success' && steps.native.outputs.verdict == 'success' && 'yes' || 'no' }}
      unmeasured: ${{ steps.native.outputs.verdict == 'unavailable' && 'yes' || 'no' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check out protected report writer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
          sparse-checkout: |
            ci/managed-check
            ci/managed-nt2
            tools/gates
      - name: Verify protected writer
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected protected workflow step to finish. Found exit %s at shell line %s.\n" "$rc" "$LINENO" >&2' ERR
          (cd ci/managed-check && sha256sum -c --quiet bundle.sha256)
      - name: Read this run's admission
        if: needs.intake.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bfme-admission-status-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-admission-status'
      - name: Authenticate the exact header declaration receipt
        id: h2_collector
        if: >-
          (needs.wide-join.outputs.h2_artifact != '' && needs.wide-join.outputs.h2_digest != '') ||
          (needs.compare.outputs.h2_artifact != '' && needs.compare.outputs.h2_digest != '')
        continue-on-error: true
        shell: bash
        env:
          BFME_RECOVERY_READ_TOKEN: ${{ github.token }}
          H2_ARTIFACT: ${{ needs.wide-join.outputs.h2_artifact || needs.compare.outputs.h2_artifact }}
          H2_DIGEST: ${{ needs.wide-join.outputs.h2_digest || needs.compare.outputs.h2_digest }}
        run: |
          set -euo pipefail
          python3 -B ci/managed-check/header_h2_action.py collect \
            "$RUNNER_TEMP/bfme-admission-status/decision.json" "$RUNNER_TEMP/bfme-h2-verified" \
            "$H2_ARTIFACT" "$H2_DIGEST"
          printf '\n## Header declaration evidence\n\nAuthenticated H2 receipt from this exact Boat attempt.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Read this run's comparison
        if: needs.compare.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bfme-verdict-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-verdict'
      - name: Read this run's joined wide comparison
        if: needs.wide-join.outputs.complete == 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bfme-verdict-wide-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-verdict'
      - name: Publish job summary and exact-head commit status
        id: native
        if: (needs.wide-plan.result != 'success' || needs.wide-join.outputs.complete == 'true')
        shell: bash
        env:
          BFME_STATUS_TOKEN: '${{ github.token }}'
          BFME_AUTOMATIC_CLAIM: '${{ needs.claim.outputs.allowed }}'
          MANAGED_PUBLIC_REPORT: '${{ runner.temp }}/bfme-report'
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected protected workflow step to finish. Found exit %s at shell line %s.\n" "$rc" "$LINENO" >&2' ERR
          rc=0
          python3 -B ci/managed-check/github_io.py finish "$RUNNER_TEMP/bfme-admission-status" "$RUNNER_TEMP/bfme-verdict" || rc=$?
          if [[ "$rc" == 2 ]]; then
            printf '%s\n' 'Stale measurement: the pull request or protected main moved before publication.' >> "$GITHUB_STEP_SUMMARY"
            printf "stale=yes\n" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$rc"
      - name: Retain readable summary for the owner
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-report-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-report'
          if-no-files-found: ignore
          retention-days: 7
      - name: Read this attempt's sanitized inline status
        id: receipt
        if: always() && !cancelled() && vars.BFME_PR_COMPACT == 'yes' && (needs.intake.outputs.route == 'compile' || (needs.intake.outputs.route == 'automatic' && needs.claim.outputs.allowed == 'yes')) && needs.compare.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bfme-inline-report-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-inline-status'
      - name: Publish exact-head inline virtual status
        shell: bash
        if: always() && !cancelled() && vars.BFME_PR_COMPACT == 'yes' && (needs.intake.outputs.route == 'compile' || (needs.intake.outputs.route == 'automatic' && needs.claim.outputs.allowed == 'yes'))
        env:
          BFME_STATUS_TOKEN: '${{ github.token }}'
          RECEIPT: '${{ steps.receipt.outcome }}'
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected protected workflow step to finish. Found exit %s at shell line %s.\n" "$rc" "$LINENO" >&2' ERR
          if [[ "$RECEIPT" == success ]]; then
            path="$RUNNER_TEMP/bfme-inline-status/inline-status.json"
          else
            path="$RUNNER_TEMP/bfme-inline-unavailable/inline-status.json"
          fi
          rc=0
          python3 -B ci/managed-check/inline_status.py "$path" "$RUNNER_TEMP/bfme-admission-status/decision.json" || rc=$?
          if [[ "$rc" == 2 ]]; then
            printf '%s\n' 'Stale measurement: the pull request or protected main moved before publication.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$rc"
      - name: Recheck current main and publish source-rule statuses
        id: publish
        if: >-
          always() && !cancelled() && vars.BFME_PR_COMPACT == 'yes' && needs.intake.outputs.source_decision != '' &&
          (needs.intake.outputs.automatic_external != 'yes' || needs.claim.outputs.allowed == 'yes')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RULE_STATUS: ${{ needs.intake.outputs.source_decision }}
        run: |
          set -euo pipefail
          rc=0
          python3 -I -S -B tools/gates/workflow.py publish || rc=$?
          if [[ "$rc" == 1 ]] && sed -n 's/^receipt=//p' "$GITHUB_OUTPUT" |
              jq -e '.state == "pending" and (.reason == "main-moved" or .reason == "pull-request-moved")' >/dev/null; then
            printf 'stale=yes\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$rc"
      - name: Retain the exact checked source-rules decision
        if: always() && !cancelled() && vars.BFME_PR_COMPACT == 'yes' && steps.publish.outcome == 'success' && steps.publish.outputs.stale != 'yes' && (github.event_name == 'pull_request_target' || github.event_name == 'repository_dispatch')
        shell: bash
        env:
          SOURCE_RULE_RECEIPT: '${{ steps.publish.outputs.receipt }}'
        run: python3 -I -S -B tools/gates/landing_receipt.py "$RUNNER_TEMP/bfme-source-receipt"
      - name: Upload the exact source-rules decision
        if: always() && !cancelled() && vars.BFME_PR_COMPACT == 'yes' && steps.publish.outcome == 'success' && steps.publish.outputs.stale != 'yes' && (github.event_name == 'pull_request_target' || github.event_name == 'repository_dispatch')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-source-receipt-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-source-receipt/receipt.json'
          if-no-files-found: error
          retention-days: 7

  wide-fallback:
    needs: [intake, wide-plan, wide-freeze, wide-join, wide-compare]
    if: >-
      ((github.actor_id == '1760627' || (github.actor_id == '41898282' && github.event_name == 'repository_dispatch')) && (github.triggering_actor == 'Ancalgonn' || github.triggering_actor == 'github-actions[bot]')) &&
      (always() && !cancelled() && needs.wide-plan.result == 'success' && needs.wide-join.outputs.complete != 'true')
    name: Verify all primary checkpoints after collector failure
    continue-on-error: true
    timeout-minutes: 25
    outputs:
      complete: "${{ steps.verdict.outcome == 'success' }}"
      h2_artifact: ${{ steps.h2_upload.outputs.artifact-id }}
      h2_digest: ${{ steps.h2_upload.outputs.artifact-digest }}
      h2_attempted: ${{ steps.h2_probe.outputs.attempted }}
    runs-on: ${{ ((github.actor_id == '1760627' || (github.actor_id == '41898282' && github.event_name == 'repository_dispatch')) && (github.triggering_actor == 'Ancalgonn' || github.triggering_actor == 'github-actions[bot]')) && (vars.BFME_PR_RUNS_ON || vars.BFME_PR_RUNNER || 'boat-small/from=bfme2-compiler-v1') || 'ubuntu-24.04' }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for runner filesystem hydration
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 90))
          runner_grace=$((SECONDS + 15))
          waited=0
          while true; do
            pending=$(awk '
              {
                for (i = 7; i <= NF - 2; i++) {
                  if ($i == "-") {
                    if ($(i + 1) ~ /^fuse(\.|$)/ && ($(i + 1) ~ /^fuse\.ascii-lazyfs(-|$)/ || $(i + 2) ~ /^ascii-lazyfs(-|$)/) && $5 !~ /^\/var\/lib\/ascii-lazy\/retired(\/|$)/) {
                      print $5
                    }
                    break
                  }
                }
              }
            ' /proc/self/mountinfo)
            if [ -z "$pending" ]; then
              if [ "$waited" -eq 1 ]; then
                printf 'Runner filesystem hydration finished after %ss.\n' "$SECONDS"
              fi
              exit 0
            fi
            home_dir="${HOME%/}"
            if [ -n "$home_dir" ] && [ "$pending" = "$home_dir" ] \
              && [ "${pending#/opt/boat-compiler}" = "$pending" ] \
              && [ "${pending#/var/}" = "$pending" ] \
              && [ "${pending#/usr}" = "$pending" ] \
              && [ "$SECONDS" -ge "$runner_grace" ]; then
              printf 'Proceeding after %ss with persistent lazy mount %s (all other mounts retired).\n' "$SECONDS" "$home_dir"
              exit 0
            fi
            waited=1
            if [ "$SECONDS" -ge "$deadline" ]; then
              printf 'Expected lazy runner mounts to retire within 90s; still mounted:\n%s\n' "$pending" >&2
              exit 1
            fi
            sleep 0.5
          done
      - name: Check out the same protected main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
      - name: Read this run's source-free recovery decision
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bfme-admission-status-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-admission-status'
      - name: Read the protected source decision from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bfme-plan-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-plan'
      - name: Read this run's exact compile assignments
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bfme-matrix-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-matrix'
      - name: Verify protected comparison and sealed image
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected protected workflow step to finish. Found exit %s at shell line %s.\n" "$rc" "$LINENO" >&2' ERR
          (cd ci/managed-check && sha256sum -c --quiet bundle.sha256)
          (cd ci/managed-nt2 && sha256sum -c --quiet bundle.sha256)
          cd /opt/boat-compiler
          sudo -n sha256sum -c --quiet input.sha256 runtime-files.sha256
          sudo -n systemd-tmpfiles --create /etc/tmpfiles.d/boat-compiler.conf
      - name: Verify the complete and timely primary set
        shell: bash
        id: freeze
        env:
          PLAN_SHA: '${{ needs.wide-plan.outputs.matrix_sha }}'
          STARTED: '${{ needs.wide-plan.outputs.started }}'
          CUTOFF: '${{ needs.wide-plan.outputs.primary_cutoff }}'
          BFME_RECOVERY_READ_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          trap 'rc=$?; printf "Expected %s to finish; found exit %s at shell line %s.\n" "Verify the complete and timely primary set" "$rc" "$LINENO" >&2' ERR
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C LC_ALL=C \
            TMPDIR="$RUNNER_TEMP" GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_OUTPUT="$GITHUB_OUTPUT" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REPOSITORY_ID="$GITHUB_REPOSITORY_ID" \
            BFME_RECOVERY_READ_TOKEN="$BFME_RECOVERY_READ_TOKEN" \
            BFME_PR_RUNNER="${BFME_PR_RUNNER:-}" \
            python3 -B ci/managed-check/recovery_broker.py fallback "$RUNNER_TEMP/bfme-admission-status" \
              "$RUNNER_TEMP/bfme-matrix" "$PLAN_SHA" "$RUNNER_TEMP/bfme-groups" \
              "$RUNNER_TEMP/lease.json" "$STARTED" "$CUTOFF"
      - name: Retain the exact primary-only recovery lease
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-recovery-fallback-lease-${{ github.run_attempt }}
          path: '${{ runner.temp }}/lease.json'
          if-no-files-found: error
          retention-days: 1
      - name: Verify exactly one result per paired assignment
        shell: bash
        env:
          PLAN_SHA: '${{ needs.wide-plan.outputs.matrix_sha }}'
          STARTED: '${{ needs.wide-plan.outputs.started }}'
          CUTOFF: '${{ needs.wide-plan.outputs.primary_cutoff }}'
          LEASE_SHA: '${{ steps.freeze.outputs.lease_sha }}'
        run: |
          set -euo pipefail
          trap 'rc=$?; printf "Expected %s to finish; found exit %s at shell line %s.\n" "Verify exactly one result per paired assignment" "$rc" "$LINENO" >&2' ERR
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C LC_ALL=C \
            TMPDIR="$RUNNER_TEMP" GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_OUTPUT="$GITHUB_OUTPUT" \
            BFME_PR_RUNNER="${BFME_PR_RUNNER:-}" \
            python3 -B ci/managed-check/wide_recovery.py join "$RUNNER_TEMP/bfme-matrix" "$PLAN_SHA" \
              "$RUNNER_TEMP/lease.json" "$LEASE_SHA" "$RUNNER_TEMP/bfme-groups" "$RUNNER_TEMP/bfme-shards"
      - name: Join complete paired outcomes
        shell: bash
        env:
          PLAN_SHA: '${{ needs.wide-plan.outputs.matrix_sha }}'
          LEASE_SHA: '${{ steps.freeze.outputs.lease_sha }}'
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected protected workflow step to finish. Found exit %s at shell line %s.\n" "$rc" "$LINENO" >&2' ERR
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C LC_ALL=C \
            TMPDIR="$RUNNER_TEMP" GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            BFME_PR_RUNNER="${BFME_PR_RUNNER:-}" \
            python3 -B ci/managed-check/wide.py join-selected "$RUNNER_TEMP/bfme-plan" \
              "$RUNNER_TEMP/bfme-matrix" "$PLAN_SHA" "$RUNNER_TEMP/bfme-shards" "$RUNNER_TEMP/bfme-verdict" \
              "$RUNNER_TEMP/lease.json" "$LEASE_SHA"
      - name: Save complete capped comparison
        id: verdict
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-verdict-wide-fallback-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-verdict/verdict.json'
          if-no-files-found: error
          retention-days: 1
      - name: Save selected sanitized advisory groups
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-recovery-selected-fallback-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-shards/'
          if-no-files-found: error
          retention-days: 1
      - name: Probe declarations on the admitted header trees
        id: h2_probe
        if: >-
          steps.verdict.outcome == 'success' && vars.BFME_PR_COMPACT == 'yes' &&
          needs.intake.outputs.source_decision != '' &&
          fromJSON(needs.intake.outputs.source_decision).overall == 'success' &&
          (vars.BFME_AUTO_HEADERS == 'yes' ||
           (github.event_name == 'pull_request_target' && github.actor_id == '1760627' &&
            github.event.action == 'labeled' && github.event.label.name == 'boat-ok'))
        continue-on-error: true
        shell: bash
        env:
          BFME_H2_SOURCE: ${{ needs.intake.outputs.source_decision }}
        run: |
          set -euo pipefail
          if ! jq -e '.report.kind == "ok"' "$RUNNER_TEMP/bfme-verdict/verdict.json" >/dev/null ||
             ! jq -e '.changed_paths | any(startswith("include/"))' "$RUNNER_TEMP/bfme-plan/plan.json" >/dev/null; then
            exit 0
          fi
          printf 'attempted=yes\n' >> "$GITHUB_OUTPUT"
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C LC_ALL=C TMPDIR="$RUNNER_TEMP" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            BFME_H2_SOURCE="$BFME_H2_SOURCE" BFME_PR_RUNNER="${BFME_PR_RUNNER:-}" \
            /usr/bin/timeout --kill-after=5s 90s \
            python3 -B ci/managed-check/header_h2_action.py probe "$RUNNER_TEMP/bfme-plan" "$RUNNER_TEMP/bfme-h2"
          test -s "$RUNNER_TEMP/bfme-h2/header-h2.json"
          test "$(wc -c < "$RUNNER_TEMP/bfme-h2/header-h2.json")" -le 131072
          printf 'available=yes\n' >> "$GITHUB_OUTPUT"
      - name: Save the bounded declaration receipt
        id: h2_upload
        if: steps.h2_probe.outputs.available == 'yes'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-header-h2-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-h2/header-h2.json'
          if-no-files-found: error
          retention-days: 1
      - name: Produce bounded trusted header observations
        id: ht_produce
        if: steps.h2_probe.outputs.attempted == 'yes'
        continue-on-error: true
        shell: bash
        env:
          BFME_H2_SOURCE: ${{ needs.intake.outputs.source_decision }}
        run: |
          set -euo pipefail
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C LC_ALL=C TMPDIR="$RUNNER_TEMP" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            BFME_H2_SOURCE="$BFME_H2_SOURCE" BFME_PR_RUNNER="${BFME_PR_RUNNER:-}" \
            /usr/bin/timeout --kill-after=5s 60s \
            python3 -B ci/managed-check/header_trusted_action.py produce "$RUNNER_TEMP/bfme-plan" "$RUNNER_TEMP/bfme-ht"
          test -s "$RUNNER_TEMP/bfme-ht/header-trusted.json"
          test "$(wc -c < "$RUNNER_TEMP/bfme-ht/header-trusted.json")" -le 524288
          printf 'available=yes\n' >> "$GITHUB_OUTPUT"
      - name: Save bounded trusted header observations
        id: ht_upload
        if: steps.ht_produce.outputs.available == 'yes'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-header-trusted-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-ht/header-trusted.json'
          if-no-files-found: error
          retention-days: 1
      - name: Measure header layout on the admitted header trees
        id: h5_wide
        if: >-
          steps.verdict.outcome == 'success' && vars.BFME_PR_COMPACT == 'yes' &&
          needs.intake.outputs.source_decision != '' &&
          fromJSON(needs.intake.outputs.source_decision).overall == 'success' &&
          (vars.BFME_AUTO_HEADERS == 'yes' ||
           (github.event_name == 'pull_request_target' && github.actor_id == '1760627' &&
            github.event.action == 'labeled' && github.event.label.name == 'boat-ok'))
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if ! jq -e '.report.kind == "ok"' "$RUNNER_TEMP/bfme-verdict/verdict.json" >/dev/null ||
             ! jq -e '.changed_paths | any(startswith("include/"))' "$RUNNER_TEMP/bfme-plan/plan.json" >/dev/null; then
            exit 0
          fi
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C LC_ALL=C TMPDIR="$RUNNER_TEMP" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            BFME_PR_RUNNER="${BFME_PR_RUNNER:-}" \
            /usr/bin/timeout --kill-after=5s 420s \
            python3 -B ci/header-witness/h5_wide.py "$RUNNER_TEMP/bfme-plan" "$RUNNER_TEMP/bfme-h5"
          printf 'available=yes\n' >> "$GITHUB_OUTPUT"
      - name: Save the bounded header layout receipt
        if: steps.h5_wide.outputs.available == 'yes'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-header-h5-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-h5/header-h5.json'
          if-no-files-found: error
          retention-days: 1

  inline-fallback-virtual:
    needs: [intake, compare, wide-plan, wide-fallback]
    if: >-
      always() && !cancelled() && needs.wide-fallback.outputs.complete == 'true' &&
      (needs.compare.outputs.inline_matrix_sha != '' || needs.wide-fallback.outputs.complete == 'true')
    name: Inline virtual behaviour after primary fallback
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Check out protected evaluator and reference
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
      - name: Read private source admission for this attempt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bfme-plan-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-plan'
      - name: Read private narrow advisory evidence
        if: needs.compare.outputs.inline_matrix_sha != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bfme-inline-narrow-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-inline-narrow'
      - name: Read protected wide matrix for this attempt
        if: needs.wide-fallback.outputs.complete == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bfme-matrix-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-matrix'
      - name: Read same-attempt compact wide receipts
        if: needs.wide-fallback.outputs.complete == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bfme-recovery-selected-fallback-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-shards'
      - name: Evaluate and render advisory result
        shell: bash
        env:
          NARROW_SHA: '${{ needs.compare.outputs.inline_matrix_sha }}'
          WIDE_SHA: '${{ needs.wide-plan.outputs.matrix_sha }}'
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected protected workflow step to finish. Found exit %s at shell line %s.\n" "$rc" "$LINENO" >&2' ERR
          (cd ci/managed-check && sha256sum -c --quiet bundle.sha256)
          (cd ci/managed-nt2 && sha256sum -c --quiet bundle.sha256)
          dir="$RUNNER_TEMP/bfme-inline-narrow"
          matrix="$dir/matrix.json"
          sha="$NARROW_SHA"
          if test -z "$sha"; then
              dir="$RUNNER_TEMP/bfme-shards"
              matrix="$RUNNER_TEMP/bfme-matrix/matrix.json"
              sha="$WIDE_SHA"
          fi
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C LC_ALL=C TMPDIR="$RUNNER_TEMP" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" BFME_INLINE_OWNER_SCOPE="$BFME_INLINE_OWNER_SCOPE" \
            BFME_PR_RUNNER="${BFME_PR_RUNNER:-}" \
            python3 -B ci/managed-check/managed_inline_action.py "$RUNNER_TEMP/bfme-plan/plan.json" \
              "$matrix" "$dir" "$sha" "$RUNNER_TEMP/bfme-inline-report"
      - name: Retain report-only state and summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-inline-report-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-inline-report'
          if-no-files-found: error
          retention-days: 1

  inline-fallback-report:
    needs: [pending, intake, claim, compare, wide-plan, wide-join, wide-fallback, inline-fallback-virtual]
    if: >-
      always() && !cancelled() && (vars.BFME_PR_COMPACT == 'yes' || needs.pending.result == 'success') &&
      (needs.intake.outputs.route == 'compile' || needs.intake.outputs.route == 'wide' || (needs.intake.outputs.route == 'automatic-wide' && needs.claim.outputs.allowed == 'yes')) && (needs.wide-plan.result == 'success' && needs.wide-join.outputs.complete != 'true')
    name: Publish inline virtual status after primary fallback
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check out protected status writer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
          sparse-checkout: ci/managed-check
      - name: Verify protected writer
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected protected workflow step to finish. Found exit %s at shell line %s.\n" "$rc" "$LINENO" >&2' ERR
          (cd ci/managed-check && sha256sum -c --quiet bundle.sha256)
      - name: Read this attempt's sanitized inline status
        id: receipt
        if: needs.inline-fallback-virtual.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bfme-inline-report-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-inline-status'
      - name: Read this attempt's source-free admission decision
        if: steps.receipt.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bfme-admission-status-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-admission-status'
      - name: Publish exact-head inline virtual status
        shell: bash
        env:
          BFME_STATUS_TOKEN: '${{ github.token }}'
          RECEIPT: '${{ steps.receipt.outcome }}'
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected protected workflow step to finish. Found exit %s at shell line %s.\n" "$rc" "$LINENO" >&2' ERR
          if [[ "$RECEIPT" == success ]]; then
            path="$RUNNER_TEMP/bfme-inline-status/inline-status.json"
          else
            path="$RUNNER_TEMP/bfme-inline-unavailable/inline-status.json"
          fi
          rc=0
          python3 -B ci/managed-check/inline_status.py "$path" "$RUNNER_TEMP/bfme-admission-status/decision.json" || rc=$?
          if [[ "$rc" == 2 ]]; then
            printf '%s\n' 'Stale measurement: the pull request or protected main moved before publication.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$rc"

  fallback-report:
    needs: [pending, intake, claim, compare, wide-plan, wide-join, wide-fallback]
    if: always() && !cancelled() && needs.intake.result != 'skipped' && (needs.wide-plan.result == 'success' && needs.wide-join.outputs.complete != 'true')
    name: Report verified wide fallback on the pull request head
    outputs:
      stale: ${{ steps.native.outputs.stale }}
      passed: ${{ steps.native.outcome == 'success' && steps.native.outputs.verdict == 'success' && 'yes' || 'no' }}
      unmeasured: ${{ steps.native.outputs.verdict == 'unavailable' && 'yes' || 'no' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check out protected report writer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
          sparse-checkout: |
            ci/managed-check
            ci/managed-nt2
      - name: Verify protected writer
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected protected workflow step to finish. Found exit %s at shell line %s.\n" "$rc" "$LINENO" >&2' ERR
          (cd ci/managed-check && sha256sum -c --quiet bundle.sha256)
      - name: Read this run's admission
        if: needs.intake.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bfme-admission-status-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-admission-status'
      - name: Authenticate the exact header declaration receipt
        id: h2_collector
        if: needs.wide-fallback.outputs.h2_artifact != '' && needs.wide-fallback.outputs.h2_digest != ''
        continue-on-error: true
        shell: bash
        env:
          BFME_RECOVERY_READ_TOKEN: ${{ github.token }}
          H2_ARTIFACT: ${{ needs.wide-fallback.outputs.h2_artifact }}
          H2_DIGEST: ${{ needs.wide-fallback.outputs.h2_digest }}
        run: |
          set -euo pipefail
          python3 -B ci/managed-check/header_h2_action.py collect \
            "$RUNNER_TEMP/bfme-admission-status/decision.json" "$RUNNER_TEMP/bfme-h2-verified" \
            "$H2_ARTIFACT" "$H2_DIGEST"
          printf '\n## Header declaration evidence\n\nAuthenticated H2 receipt from this exact Boat attempt.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Read this run's comparison
        if: needs.compare.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bfme-verdict-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-verdict'
      - name: Read this run's joined wide comparison
        if: needs.wide-fallback.outputs.complete == 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bfme-verdict-wide-fallback-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-verdict'
      - name: Publish job summary and exact-head commit status
        id: native
        shell: bash
        env:
          BFME_STATUS_TOKEN: '${{ github.token }}'
          BFME_AUTOMATIC_CLAIM: '${{ needs.claim.outputs.allowed }}'
          MANAGED_PUBLIC_REPORT: '${{ runner.temp }}/bfme-report'
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected protected workflow step to finish. Found exit %s at shell line %s.\n" "$rc" "$LINENO" >&2' ERR
          rc=0
          python3 -B ci/managed-check/github_io.py finish "$RUNNER_TEMP/bfme-admission-status" "$RUNNER_TEMP/bfme-verdict" || rc=$?
          if [[ "$rc" == 2 ]]; then
            printf '%s\n' 'Stale measurement: the pull request or protected main moved before publication.' >> "$GITHUB_STEP_SUMMARY"
            printf "stale=yes\n" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$rc"
      - name: Retain readable summary for the owner
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-report-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-report'
          if-no-files-found: ignore
          retention-days: 7


  stale-refresh:
    needs: [intake, report, fallback-report]
    if: >-
      always() && !cancelled() && github.repository_id == '1464323350' && github.ref == 'refs/heads/main' &&
      vars.BFME_AUTO_ADMISSION != 'yes' && github.event_name == 'pull_request_target' &&
      github.actor_id == '1760627' && github.triggering_actor == 'Ancalgonn' && github.run_attempt == '1' &&
      (needs.intake.outputs.route == 'compile' || needs.intake.outputs.route == 'wide') &&
      (needs.report.outputs.stale == 'yes' || needs.fallback-report.outputs.stale == 'yes')
    name: Request a fresh admitted comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Rebind the same admitted head to the new protected main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$NUMBER" =~ ^[1-9][0-9]*$ && "$HEAD_SHA" =~ ^[a-f0-9]{40}$ && "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          repo=Open-BFME/BFME2-Rebuild
          base=$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')
          [[ "$base" =~ ^[a-f0-9]{40}$ ]]
          if [[ "$base" == "$GITHUB_SHA" ]]; then
            echo 'Protected main is unchanged. The current head event will start its own check.'
            exit 0
          fi
          pr=$(gh api "repos/$repo/pulls/$NUMBER")
          if ! jq -e --arg head "$HEAD_SHA" '
              .state == "open" and .head.sha == $head and .base.ref == "main" and .base.repo.id == 1464323350 and
              (.head.repo.id == 1464323350 or .author_association == "OWNER" or .author_association == "MEMBER" or
               .author_association == "COLLABORATOR")
            ' <<< "$pr" >/dev/null; then
            echo 'The previously admitted head is no longer current or approved.'
            exit 0
          fi
          jq -n --argjson number "$NUMBER" --arg head "$HEAD_SHA" --arg base "$base" \
            '{event_type: "bfme-remeasure", client_payload: {number: $number, head: $head, base: $base}}' |
            gh api --method POST "repos/$repo/dispatches" --input -
          printf 'Requested a fresh comparison of the admitted head on main %s.\n' "${base:0:12}" >> "$GITHUB_STEP_SUMMARY"

  # GitHub starts no workflow_run event for a run whose trigger was sent with the Actions token, so the landing and
  # enqueue workflows never hear that a dispatch-started check finished. After this run reported, whatever the
  # verdict, ask them to look now: a pass can land and a refusal or outage frees a backfill slot. It cannot loop, as
  # enqueue never re-requests a head within its cooldown. No checkout, no pull request content, no payload.
  notify-landing:
    needs: [report, fallback-report]
    if: >-
      always() && !cancelled() &&
      (needs.report.result != 'skipped' || needs.fallback-report.result != 'skipped') &&
      github.repository_id == '1464323350' && github.ref == 'refs/heads/main' &&
      github.event_name == 'repository_dispatch' && github.actor_id == '41898282'
    name: Ask the landing workflow to look now
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - name: Send bfme-land-next
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -n '{event_type: "bfme-land-next", client_payload: {}}' |
            gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input - >/dev/null

  # A check that claimed its automatic reservation and then measured nothing (a machine fault) leaves no verdict, and
  # only an admission run can re-issue that reservation, after this run has completed and been quiet for 120 s
  # (admit.unmeasured_claim). Hand the wait to admission-unmeasured.yml. Only for a claimed reservation, so the
  # bound is the ledger's: at most two re-issues per commit per main, then a plain hold.
  notify-unmeasured:
    needs: [claim, report, fallback-report]
    if: >-
      always() && !cancelled() && needs.claim.outputs.allowed == 'yes' &&
      (needs.report.outputs.unmeasured == 'yes' || needs.fallback-report.outputs.unmeasured == 'yes') &&
      github.repository_id == '1464323350' && github.ref == 'refs/heads/main' &&
      github.event_name == 'repository_dispatch' && github.actor_id == '41898282'
    name: Ask admission to look again after this run
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - name: Send bfme-unmeasured
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.client_payload.number }}
          RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$NUMBER" =~ ^[1-9][0-9]{0,8}$ || ! "$RUN" =~ ^[1-9][0-9]{0,19}$ ]]; then
            echo "Expected one pull request number and this run id. Found something else." >&2
            exit 1
          fi
          jq -n --argjson number "$NUMBER" --arg run "$RUN" \
            '{event_type: "bfme-unmeasured", client_payload: {number: $number, run: $run}}' |
            gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input - >/dev/null

  notify-header-rules:
    needs: [compare, wide-join, wide-fallback, report, fallback-report]
    if: >-
      always() && !cancelled() && github.repository_id == '1464323350' &&
      github.ref == 'refs/heads/main' &&
      (needs.wide-join.outputs.h2_attempted == 'yes' || needs.wide-fallback.outputs.h2_attempted == 'yes' || needs.compare.outputs.h2_attempted == 'yes') &&
      ((needs.report.result == 'success' && needs.report.outputs.stale != 'yes') ||
       (needs.fallback-report.result == 'success' && needs.fallback-report.outputs.stale != 'yes'))
    name: Ask the hosted header rules to refresh
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Wake the header reporter for this pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number || github.event.client_payload.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.client_payload.head }}
        run: |
          set -euo pipefail
          [[ "$NUMBER" =~ ^[1-9][0-9]{0,8}$ && "$HEAD_SHA" =~ ^[a-f0-9]{40}$ &&
             "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          repo=Open-BFME/BFME2-Rebuild
          main=$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')
          if [[ "$main" != "$GITHUB_SHA" ]]; then
            echo "The check's protected main moved. Nothing to refresh."
            exit 0
          fi
          pull=$(gh api "repos/$repo/pulls/$NUMBER")
          if ! jq -e --arg head "$HEAD_SHA" '
              .state == "open" and .draft == false and .head.sha == $head and
              .base.ref == "main" and .base.repo.id == 1464323350
            ' <<< "$pull" >/dev/null; then
            echo "The checked pull request moved. Nothing to refresh."
            exit 0
          fi
          jq -n --argjson number "$NUMBER" '{event_type: "bfme-header-rules", client_payload: {number: $number}}' |
            gh api --method POST "repos/$repo/dispatches" --input -
