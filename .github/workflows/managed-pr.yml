          fi
          (( rc == 0 ))
          echo "complete=true" >> "$GITHUB_OUTPUT"
      - name: Save paired primary checkpoint 3
        id: checkpoint3
        if: steps.group3.outputs.complete == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-recovery-primary-${{ github.run_attempt }}-${{ matrix.index }}-3
          path: '${{ runner.temp }}/bfme-paired-3/group.json'
          if-no-files-found: error
          retention-days: 1
      - name: Check whether trusted base cache updated
        id: wide_cache_check
        if: always() && !cancelled()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/bfme-base-cache/.updated" ]; then
            rm -f "$RUNNER_TEMP/bfme-base-cache/.updated"
            echo "save=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Save trusted base object cache
        if: always() && !cancelled() && steps.wide_cache_check.outputs.save == 'yes'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: '${{ runner.temp }}/bfme-base-cache'
          key: bfme-base-obj-v1-s${{ matrix.index }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Account for every planned primary checkpoint
        if: always() && !cancelled()
        shell: bash
        env:
          SHARD: '${{ matrix.index }}'
          GROUPS: '${{ needs.wide-plan.outputs.groups }}'
          CHECKPOINT_0: '${{ steps.checkpoint0.outputs.artifact-id }}'
          UPLOAD_0: '${{ steps.checkpoint0.outcome }}'
          DEFERRED_0: '${{ steps.group0.outputs.deferred }}'
          CHECKPOINT_1: '${{ steps.checkpoint1.outputs.artifact-id }}'
          UPLOAD_1: '${{ steps.checkpoint1.outcome }}'
          DEFERRED_1: '${{ steps.group1.outputs.deferred }}'
          CHECKPOINT_2: '${{ steps.checkpoint2.outputs.artifact-id }}'
          UPLOAD_2: '${{ steps.checkpoint2.outcome }}'
          DEFERRED_2: '${{ steps.group2.outputs.deferred }}'
          CHECKPOINT_3: '${{ steps.checkpoint3.outputs.artifact-id }}'
          UPLOAD_3: '${{ steps.checkpoint3.outcome }}'
          DEFERRED_3: '${{ steps.group3.outputs.deferred }}'
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json
          import os
          import re

          shard = int(os.environ["SHARD"])
          planned = sorted(row["part"] for row in json.loads(os.environ["GROUPS"]) if row["shard"] == shard)
          if not planned or len(planned) != len(set(planned)) or any(part not in range(4) for part in planned):
              raise SystemExit(f"Primary shard {shard}: invalid or missing protected group schedule")
          missing = []
          reasons = {"deadline-before-start", "forced-reserve-canary", "compile-deadline"}
          for part in planned:
              artifact = os.environ[f"CHECKPOINT_{part}"]
              if os.environ[f"UPLOAD_{part}"] == "success" and re.fullmatch(r"[1-9][0-9]*", artifact):
                  continue
              reason = os.environ[f"DEFERRED_{part}"]
              missing.append(f"{shard}-{part} ({reason if reason in reasons else 'checkpoint not uploaded'})")
          line = f"Primary shard {shard}: uploaded {len(planned) - len(missing)}/{len(planned)} planned checkpoints."
          if missing:
              line += f" Incomplete primary groups: {', '.join(missing)}."
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              print(line, file=summary)
          if missing:
              print(f"::warning::{line}")
              raise SystemExit(1)
          PY

  wide-freeze:
    needs: [intake, wide-plan]
    if: >-
      ((github.actor_id == '1760627' || (github.actor_id == '41898282' && github.event_name == 'repository_dispatch')) && (github.triggering_actor == 'Ancalgonn' || github.triggering_actor == 'github-actions[bot]')) &&
      (always() && !cancelled() && needs.wide-plan.result == 'success')
    name: Freeze primary wide checkpoints
    continue-on-error: true
    timeout-minutes: 25
    outputs:
      lease_sha: '${{ steps.freeze.outputs.lease_sha }}'
      reserve_needed: '${{ steps.freeze.outputs.reserve_needed }}'
      reserve_slots: '${{ steps.freeze.outputs.reserve_slots }}'
      has_primaries: '${{ steps.freeze.outputs.has_primaries }}'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Read the wide recovery tools from protected main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
          sparse-checkout: |
            ci/managed-check
            ci/managed-nt2
      - name: Read this run's source-free recovery decision
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bfme-admission-status-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-admission-status'
      - name: Read this run's exact compile assignments
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bfme-matrix-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-matrix'
      - name: Verify protected recovery tools
        shell: bash
        run: |
          set -Eeuo pipefail
          (cd ci/managed-check && sha256sum -c --quiet bundle.sha256)
          (cd ci/managed-nt2 && sha256sum -c --quiet bundle.sha256)
      - name: Freeze verified primaries and bind unfinished work to reserve slots
        shell: bash
        id: freeze
        env:
          PLAN_SHA: '${{ needs.wide-plan.outputs.matrix_sha }}'
          STARTED: '${{ needs.wide-plan.outputs.started }}'
          CUTOFF: '${{ needs.wide-plan.outputs.primary_cutoff }}'
          BFME_RECOVERY_READ_TOKEN: '${{ github.token }}'
          FORCE_FALLBACK: '${{ vars.BFME_PRIMARY_FALLBACK_TEST }}'
          EXACT_HEAD: '${{ github.event.pull_request.head.sha || github.event.client_payload.head }}'
        run: |
          set -euo pipefail
          trap 'rc=$?; printf "Expected %s to finish; found exit %s at shell line %s.\n" "Freeze verified primaries and bind unfinished work to reserve slots" "$rc" "$LINENO" >&2' ERR
          if [[ "$FORCE_FALLBACK" == 'yes' && "$EXACT_HEAD" == a88a136a54c7f1456d7a670960ffcff0ee831f5e ]]; then
            printf '%s\n' 'Expected the primary collector to run. Found the owner-approved fallback test.' >&2
            exit 64
          fi
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C LC_ALL=C \
            TMPDIR="$RUNNER_TEMP" GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_OUTPUT="$GITHUB_OUTPUT" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REPOSITORY_ID="$GITHUB_REPOSITORY_ID" \
            BFME_RECOVERY_READ_TOKEN="$BFME_RECOVERY_READ_TOKEN" \
            BFME_PR_RUNNER="${BFME_PR_RUNNER:-}" \
            python3 -B ci/managed-check/recovery_broker.py freeze "$RUNNER_TEMP/bfme-admission-status" \
              "$RUNNER_TEMP/bfme-matrix" "$PLAN_SHA" "$RUNNER_TEMP/bfme-groups" \
              "$RUNNER_TEMP/lease.json" "$STARTED" "$CUTOFF"
      - name: Publish the protected reserve assignment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-recovery-lease-${{ github.run_attempt }}
          path: '${{ runner.temp }}/lease.json'
          if-no-files-found: error
          retention-days: 1
      - name: Save collected primary checkpoints for join
        if: steps.freeze.outputs.has_primaries == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-frozen-primaries-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-groups/'
          if-no-files-found: error
          retention-days: 1

  wide-reserve:
    needs: [wide-plan, wide-freeze]
    if: >-
      ((github.actor_id == '1760627' || (github.actor_id == '41898282' && github.event_name == 'repository_dispatch')) && (github.triggering_actor == 'Ancalgonn' || github.triggering_actor == 'github-actions[bot]')) &&
      (always() && !cancelled() && needs.wide-plan.result == 'success' && needs.wide-freeze.result == 'success' && needs.wide-freeze.outputs.reserve_needed == 'true')
    name: Reassign paired files on reserve ${{ matrix.slot }}
    continue-on-error: true
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        slot: ${{ fromJSON(needs.wide-freeze.outputs.reserve_needed == 'true' && needs.wide-freeze.outputs.reserve_slots || '[0]') }}
    runs-on: ${{ ((github.actor_id == '1760627' || (github.actor_id == '41898282' && github.event_name == 'repository_dispatch')) && (github.triggering_actor == 'Ancalgonn' || github.triggering_actor == 'github-actions[bot]')) && (vars.BFME_PR_RUNS_ON || vars.BFME_PR_RUNNER || 'boat-small/from=bfme2-compiler-v1') || 'ubuntu-24.04' }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for runner filesystem hydration
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 90))
          runner_grace=$((SECONDS + 15))
          waited=0
          while true; do
            pending=$(awk '
              {
                for (i = 7; i <= NF - 2; i++) {
                  if ($i == "-") {
                    if ($(i + 1) ~ /^fuse(\.|$)/ && ($(i + 1) ~ /^fuse\.ascii-lazyfs(-|$)/ || $(i + 2) ~ /^ascii-lazyfs(-|$)/) && $5 !~ /^\/var\/lib\/ascii-lazy\/retired(\/|$)/) {
                      print $5
                    }
                    break
                  }
                }
              }
            ' /proc/self/mountinfo)
            if [ -z "$pending" ]; then
              if [ "$waited" -eq 1 ]; then
                printf 'Runner filesystem hydration finished after %ss.\n' "$SECONDS"
              fi
              exit 0
            fi
            home_dir="${HOME%/}"
            if [ -n "$home_dir" ] && [ "$pending" = "$home_dir" ] \
              && [ "${pending#/opt/boat-compiler}" = "$pending" ] \
              && [ "${pending#/var/}" = "$pending" ] \
              && [ "${pending#/usr}" = "$pending" ] \
              && [ "$SECONDS" -ge "$runner_grace" ]; then
              printf 'Proceeding after %ss with persistent lazy mount %s (all other mounts retired).\n' "$SECONDS" "$home_dir"
              exit 0
            fi
            waited=1
            if [ "$SECONDS" -ge "$deadline" ]; then
              printf 'Expected lazy runner mounts to retire within 90s; still mounted:\n%s\n' "$pending" >&2
              exit 1
            fi
            sleep 0.5
          done
      - name: Check out the same protected main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
      - name: Read this run's source-free recovery decision
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bfme-admission-status-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-admission-status'
      - name: Read the protected source decision from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bfme-plan-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-plan'
      - name: Read this run's exact compile assignments
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bfme-matrix-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-matrix'
      - name: Verify protected comparison and sealed image
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected protected workflow step to finish. Found exit %s at shell line %s.\n" "$rc" "$LINENO" >&2' ERR
          (cd ci/managed-check && sha256sum -c --quiet bundle.sha256)
          (cd ci/managed-nt2 && sha256sum -c --quiet bundle.sha256)
          cd /opt/boat-compiler
          sudo -n sha256sum -c --quiet input.sha256 runtime-files.sha256
          sudo -n systemd-tmpfiles --create /etc/tmpfiles.d/boat-compiler.conf
      - name: Wait for protected paired-work lease
        shell: bash
        id: lease
        env:
          PLAN_SHA: '${{ needs.wide-plan.outputs.matrix_sha }}'
          STARTED: '${{ needs.wide-plan.outputs.started }}'
          CUTOFF: '${{ needs.wide-plan.outputs.primary_cutoff }}'
          BFME_RECOVERY_READ_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          trap 'rc=$?; printf "Expected %s to finish; found exit %s at shell line %s.\n" "Wait for protected paired-work lease" "$rc" "$LINENO" >&2' ERR
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C LC_ALL=C \
            TMPDIR="$RUNNER_TEMP" GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_OUTPUT="$GITHUB_OUTPUT" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REPOSITORY_ID="$GITHUB_REPOSITORY_ID" \
            BFME_RECOVERY_READ_TOKEN="$BFME_RECOVERY_READ_TOKEN" \
            BFME_PR_RUNNER="${BFME_PR_RUNNER:-}" \
            python3 -B ci/managed-check/recovery_broker.py lease "$RUNNER_TEMP/bfme-admission-status" \
              "$RUNNER_TEMP/bfme-matrix" "$PLAN_SHA" "$RUNNER_TEMP/bfme-recovery-lease" "$STARTED" "$CUTOFF"
      - name: Supervise the isolated leased reserve compile
        shell: bash
        id: reserve
        if: steps.lease.outputs.reserve_needed == 'true'
        env:
          PLAN_SHA: '${{ needs.wide-plan.outputs.matrix_sha }}'
          STARTED: '${{ needs.wide-plan.outputs.started }}'
          CUTOFF: '${{ needs.wide-plan.outputs.primary_cutoff }}'
          SLOT: '${{ matrix.slot }}'
          LEASE_SHA: '${{ steps.lease.outputs.lease_sha }}'
          BFME_RECOVERY_READ_TOKEN: '${{ github.token }}'
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected the leased reserve to finish. Found exit %s at line %s.\n" "$rc" "$LINENO" >&2' ERR
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C LC_ALL=C \
            TMPDIR="$RUNNER_TEMP" GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_OUTPUT="$GITHUB_OUTPUT" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REPOSITORY_ID="$GITHUB_REPOSITORY_ID" \
            BFME_RECOVERY_READ_TOKEN="$BFME_RECOVERY_READ_TOKEN" \
            BFME_PR_RUNNER="${BFME_PR_RUNNER:-}" \
            python3 -B ci/managed-check/recovery_broker.py reserve "$RUNNER_TEMP/bfme-admission-status" \
              "$RUNNER_TEMP/bfme-plan" "$RUNNER_TEMP/bfme-matrix" "$PLAN_SHA" \
              "$RUNNER_TEMP/bfme-recovery-lease/lease.json" "$LEASE_SHA" "$SLOT" \
              "$RUNNER_TEMP/bfme-reserve" "$STARTED" "$CUTOFF"
      - name: Save this runner's leased groups
        if: steps.reserve.outputs.complete == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-recovery-reserve-${{ github.run_attempt }}-${{ matrix.slot }}
          path: '${{ runner.temp }}/bfme-reserve/'
          if-no-files-found: error
          retention-days: 1

