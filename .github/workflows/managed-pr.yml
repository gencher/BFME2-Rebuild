name: BFME II Boat comparison

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled, edited]

  repository_dispatch:
    types: [bfme-remeasure]

permissions: {}

env:
  BFME_AUTO_ADMISSION: '${{ vars.BFME_AUTO_ADMISSION }}'
  BFME_PR_COMPACT: '${{ vars.BFME_PR_COMPACT }}'
  BFME_PR_RUNNER: '${{ vars.BFME_PR_RUNNER || '''' }}'
  BFME_ADMISSION_DAILY_TOTAL: '${{ vars.BFME_ADMISSION_DAILY_TOTAL }}'
  BFME_ADMISSION_DAILY_PER_AUTHOR: '${{ vars.BFME_ADMISSION_DAILY_PER_AUTHOR }}'
  BFME_AUTO_HEADERS: '${{ vars.BFME_AUTO_HEADERS }}'
  BFME_ADMISSION_WIDE_DAILY_TOTAL: '${{ vars.BFME_ADMISSION_WIDE_DAILY_TOTAL }}'
  BFME_ADMISSION_WIDE_DAILY_PER_AUTHOR: '${{ vars.BFME_ADMISSION_WIDE_DAILY_PER_AUTHOR }}'
  BFME_TRIGGERING_ACTOR: '${{ github.triggering_actor }}'
  BFME_INLINE_OWNER_SCOPE: '${{ vars.BFME_INLINE_OWNER_SCOPE }}'

concurrency:
  group: >-
    managed-pr-${{ github.event_name == 'repository_dispatch' && 'dispatch' || github.event.pull_request.number }}-${{
      github.event_name == 'repository_dispatch' && github.run_id ||
      ((github.event.action == 'edited' && github.event.changes.base.ref.from == '') ||
        ((github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
          github.event.label.name != 'boat-ok')) && github.run_id || 'active' }}
  cancel-in-progress: true

jobs:
  pending:
    if: >-
      vars.BFME_PR_COMPACT != 'yes' &&
      github.repository_id == '1464323350' && github.ref == 'refs/heads/main' &&
      github.repository == 'Open-BFME/BFME2-Rebuild' &&
      (github.event.action != 'edited' || github.event.changes.base.ref.from != '') &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
        github.event.label.name == 'boat-ok')
    name: Start exact-head status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check out protected status writer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
          sparse-checkout: |
            ci/managed-check
            ci/managed-nt2
      - name: Start exact-head status
        shell: bash
        env:
          BFME_STATUS_TOKEN: '${{ github.token }}'
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected protected workflow step to finish. Found exit %s at shell line %s.\n" "$rc" "$LINENO" >&2' ERR
          (cd ci/managed-check && sha256sum -c --quiet bundle.sha256)
          python3 -B ci/managed-check/github_io.py start

  # With automatic admission, an outside fork's own pull_request_target event can never start the compiler here
  # (fork_admission.authority: only a bot dispatch carries a reservation), and rules.yml already checks its source
  # rules and wakes admission, which dispatches bfme-remeasure. Skip that event instead of binding, fetching and
  # re-reading GitHub for nothing; a boat-ok label event, maintainer and same-repository pull requests, and every
  # dispatch still run.
  intake:
    if: >-
      github.repository_id == '1464323350' && github.ref == 'refs/heads/main' &&
      github.repository == 'Open-BFME/BFME2-Rebuild' &&
      (github.event.action != 'edited' || github.event.changes.base.ref.from != '') &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
        github.event.label.name == 'boat-ok') &&
      !(vars.BFME_AUTO_ADMISSION == 'yes' && vars.BFME_PR_COMPACT == 'yes' &&
        github.event_name == 'pull_request_target' &&
        github.event.action != 'labeled' && github.event.action != 'unlabeled' &&
        github.event.pull_request.head.repo.id != 1464323350 &&
        !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
    name: Protected source intake
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      route: '${{ steps.plan.outputs.route }}'
      automatic_external: '${{ steps.bind.outputs.automatic_external }}'
      source_decision: '${{ steps.evaluate.outputs.status }}'
    steps:
      - name: Check out protected main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.sha }}'
          fetch-depth: 1
          persist-credentials: false
      - name: Verify protected check package
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected protected workflow step to finish. Found exit %s at shell line %s.\n" "$rc" "$LINENO" >&2' ERR
          (cd ci/managed-check && sha256sum -c --quiet bundle.sha256)
          (cd ci/managed-nt2 && sha256sum -c --quiet bundle.sha256)
      - name: Start exact-head status
        if: vars.BFME_PR_COMPACT == 'yes'
        shell: bash
        env:
          BFME_STATUS_TOKEN: '${{ github.token }}'
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected protected workflow step to finish. Found exit %s at shell line %s.\n" "$rc" "$LINENO" >&2' ERR
          (cd ci/managed-check && sha256sum -c --quiet bundle.sha256)
          python3 -B ci/managed-check/github_io.py start
      - name: Check the current pull request and read its admission
        id: bind
        shell: bash
        env:
          BFME_READ_TOKEN: '${{ github.token }}'
        run: |
          set -Eeuo pipefail
          python3 -B ci/managed-check/github_io.py bind "$RUNNER_TEMP/bfme-receive"
      - name: Receive exact public Git objects without a credential
        shell: bash
        run: |
          set -Eeuo pipefail
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C LC_ALL=C TMPDIR="$RUNNER_TEMP" \
            BFME_PR_RUNNER="${BFME_PR_RUNNER:-}" \
            python3 -B ci/managed-check/github_io.py fetch "$RUNNER_TEMP/bfme-receive"
      - name: Validate source and determine affected files
        id: plan
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected protected workflow step to finish. Found exit %s at shell line %s.\n" "$rc" "$LINENO" >&2' ERR
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C LC_ALL=C \
            GITHUB_OUTPUT="$GITHUB_OUTPUT" TMPDIR="$RUNNER_TEMP" \
            BFME_PR_RUNNER="${BFME_PR_RUNNER:-}" \
            python3 -B ci/managed-check/intake.py "$RUNNER_TEMP/bfme-receive" "$RUNNER_TEMP/bfme-plan"
      - name: Save protected source decision
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-plan-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-plan'
          if-no-files-found: error
          retention-days: 1
      - name: Save source-free admission decision
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-admission-status-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-plan/decision.json'
          if-no-files-found: error
          retention-days: 1
      - name: Confirm the current change and repository visibility
        id: authorize
        if: >-
          vars.BFME_PR_COMPACT == 'yes' &&
          !(vars.BFME_AUTO_ADMISSION == 'yes' && github.event_name == 'pull_request_target' &&
           github.event.action != 'labeled' &&
           github.event.pull_request.head.repo.id != 1464323350 &&
           !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -S -B tools/gates/workflow.py authorize
      - name: Fetch public Git objects without credentials
        if: steps.authorize.outputs.transport == 'public'
        id: fetch-public
        shell: bash
        run: |
          env -i PATH=/usr/bin:/bin HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REPOSITORY_ID="$GITHUB_REPOSITORY_ID" \
            GITHUB_REF="$GITHUB_REF" GITHUB_SHA="$GITHUB_SHA" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" GITHUB_API_URL="$GITHUB_API_URL" \
            GITHUB_SERVER_URL="$GITHUB_SERVER_URL" GITHUB_OUTPUT="$GITHUB_OUTPUT" \
            SOURCE_TRANSPORT=public \
            python3 -I -S -B tools/gates/workflow.py fetch
      - name: Receive same-repository changes in the private repository
        if: steps.authorize.outputs.transport == 'private'
        id: fetch-private
        shell: bash
        env:
          SOURCE_TRANSPORT: private
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -S -B tools/gates/workflow.py fetch
      - name: Evaluate the source rules without credentials
        if: >-
          always() && !cancelled() && vars.BFME_PR_COMPACT == 'yes' &&
          steps.plan.outcome == 'success' && steps.authorize.outcome == 'success'
        id: evaluate
        shell: bash
        env:
          SOURCE_OBJECTS: ${{ steps.fetch-public.outputs.scratch || steps.fetch-private.outputs.scratch }}
          FETCH_REASON: ${{ steps.authorize.outputs.reason || steps.fetch-public.outputs.reason || steps.fetch-private.outputs.reason }}
        run: |
          env -i PATH=/usr/bin:/bin HOME="$HOME" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REPOSITORY_ID="$GITHUB_REPOSITORY_ID" \
            GITHUB_REF="$GITHUB_REF" GITHUB_SHA="$GITHUB_SHA" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" GITHUB_API_URL="$GITHUB_API_URL" \
            GITHUB_SERVER_URL="$GITHUB_SERVER_URL" GITHUB_OUTPUT="$GITHUB_OUTPUT" \
            GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" SOURCE_OBJECTS="$SOURCE_OBJECTS" \
            FETCH_REASON="$FETCH_REASON" \
            python3 -I -S -B tools/gates/workflow.py evaluate

  claim:
    needs: intake
    if: >-
      needs.intake.result == 'success' && (needs.intake.outputs.route == 'automatic' || needs.intake.outputs.route == 'automatic-wide') &&
      vars.BFME_AUTO_ADMISSION == 'yes' && vars.BFME_PR_COMPACT == 'yes' &&
      fromJSON(needs.intake.outputs.source_decision || '{}').state == 'pass' &&
      github.repository_id == '1464323350' && github.ref == 'refs/heads/main' &&
      github.event_name == 'repository_dispatch' && github.actor_id == '41898282' &&
      github.triggering_actor == 'github-actions[bot]' && github.run_attempt == '1'
    name: Claim one automatic compiler reservation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: read
    outputs:
      allowed: '${{ steps.reserve.outputs.allowed }}'
    steps:
      - name: Check out protected admission tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
          sparse-checkout: |
            ci/admission
            ci/landing
            ci/managed-check
      - name: Read the source-free decision from this attempt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bfme-admission-status-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-admission-status'
      - name: Consume only the exact reserved admission
        id: reserve
        shell: bash
        env:
          BFME_AUTOMATIC_SOURCE: ${{ needs.intake.outputs.source_decision }}
          BFME_READ_TOKEN: '${{ github.token }}'
        run: |
          set -Eeuo pipefail
          (cd ci/managed-check && sha256sum -c --quiet bundle.sha256)
          python3 -B ci/managed-check/fork_admission.py "$RUNNER_TEMP/bfme-admission-status/decision.json"

  compare:
    needs: [pending, intake, claim]
    if: >-
      ((github.actor_id == '1760627' || (github.actor_id == '41898282' && github.event_name == 'repository_dispatch')) && (github.triggering_actor == 'Ancalgonn' || github.triggering_actor == 'github-actions[bot]')) &&
      (always() && !cancelled() && needs.intake.result == 'success' && (vars.BFME_PR_COMPACT == 'yes' || needs.pending.result == 'success') && (needs.intake.outputs.route == 'compile' || (needs.intake.outputs.route == 'automatic' && needs.claim.result == 'success' && needs.claim.outputs.allowed == 'yes')))
    name: Isolated Boat compiler and native comparison
    runs-on: ${{ ((github.actor_id == '1760627' || (github.actor_id == '41898282' && github.event_name == 'repository_dispatch')) && (github.triggering_actor == 'Ancalgonn' || github.triggering_actor == 'github-actions[bot]')) && (vars.BFME_PR_RUNS_ON || vars.BFME_PR_RUNNER || 'boat-small/from=bfme2-compiler-v1') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      h2_artifact: ${{ steps.h2_upload.outputs.artifact-id }}
      h2_digest: ${{ steps.h2_upload.outputs.artifact-digest }}
      h2_attempted: ${{ steps.h2_probe.outputs.attempted }}
      inline_matrix_sha: '${{ steps.compile.outputs.inline_matrix_sha }}'
    steps:
      - name: Wait for runner filesystem hydration
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 90))
          runner_grace=$((SECONDS + 15))
          waited=0
          while true; do
            pending=$(awk '
              {
                for (i = 7; i <= NF - 2; i++) {
                  if ($i == "-") {
                    if ($(i + 1) ~ /^fuse(\.|$)/ && ($(i + 1) ~ /^fuse\.ascii-lazyfs(-|$)/ || $(i + 2) ~ /^ascii-lazyfs(-|$)/) && $5 !~ /^\/var\/lib\/ascii-lazy\/retired(\/|$)/) {
                      print $5
                    }
                    break
                  }
                }
              }
            ' /proc/self/mountinfo)
            if [ -z "$pending" ]; then
              if [ "$waited" -eq 1 ]; then
                printf 'Runner filesystem hydration finished after %ss.\n' "$SECONDS"
              fi
              exit 0
            fi
            home_dir="${HOME%/}"
            if [ -n "$home_dir" ] && [ "$pending" = "$home_dir" ] \
              && [ "${pending#/opt/boat-compiler}" = "$pending" ] \
              && [ "${pending#/var/}" = "$pending" ] \
              && [ "${pending#/usr}" = "$pending" ] \
              && [ "$SECONDS" -ge "$runner_grace" ]; then
              printf 'Proceeding after %ss with persistent lazy mount %s (all other mounts retired).\n' "$SECONDS" "$home_dir"
              exit 0
            fi
            waited=1
            if [ "$SECONDS" -ge "$deadline" ]; then
              printf 'Expected lazy runner mounts to retire within 90s; still mounted:\n%s\n' "$pending" >&2
              exit 1
            fi
            sleep 0.5
          done
      - name: Check out the same protected main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
      - name: Read protected source plan from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bfme-plan-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-plan'
      - name: Verify image and comparison inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected protected workflow step to finish. Found exit %s at shell line %s.\n" "$rc" "$LINENO" >&2' ERR
          (cd ci/managed-check && sha256sum -c --quiet bundle.sha256)
          (cd ci/header-witness && sha256sum -c --quiet bundle.sha256)
          (
            cd ci/managed-nt2
            sha256sum -c --quiet bundle.sha256
            got=$(printf '%s\n' '?f@X@@QAEHXZ' | engine/gen/bin/demangle)
            test "$got" = 'public: int __thiscall X::f(void)'
          )
          cd /opt/boat-compiler
          sudo -n sha256sum -c --quiet input.sha256 runtime-files.sha256
          sudo -n systemd-tmpfiles --create /etc/tmpfiles.d/boat-compiler.conf
      - name: Restore trusted base object cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: '${{ runner.temp }}/bfme-base-cache'
          key: bfme-base-obj-v1-n-${{ github.sha }}
          restore-keys: |
            bfme-base-obj-v1-n-
            bfme-base-obj-v1-
      - name: Compile admitted source and compare exact pairs
        id: compile
        shell: bash
        env:
          # Header layout evidence runs under the same switch as the header declaration probe.
          H5_ON: >-
            ${{ vars.BFME_PR_COMPACT == 'yes' && (vars.BFME_AUTO_HEADERS == 'yes' ||
                (github.event_name == 'pull_request_target' && github.actor_id == '1760627' &&
                 github.event.action == 'labeled' && github.event.label.name == 'boat-ok')) }}
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected protected workflow step to finish. Found exit %s at shell line %s.\n" "$rc" "$LINENO" >&2' ERR
          test -z "${BFME_READ_TOKEN:-}${BFME_STATUS_TOKEN:-}${GITHUB_TOKEN:-}"
          h5_export=""
          if [ "$H5_ON" = true ]; then
            h5_export="$RUNNER_TEMP/bfme-h5"
          fi
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C LC_ALL=C \
            TMPDIR="$RUNNER_TEMP" GITHUB_SHA="$GITHUB_SHA" GITHUB_OUTPUT="$GITHUB_OUTPUT" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            BFME_BASE_CACHE="$RUNNER_TEMP/bfme-base-cache" \
            BFME_INLINE_EXPORT="$RUNNER_TEMP/bfme-inline-narrow" BFME_H5_EXPORT="$h5_export" \
            BFME_PR_RUNNER="${BFME_PR_RUNNER:-}" \
            python3 -B ci/managed-check/compare.py "$RUNNER_TEMP/bfme-plan" "$RUNNER_TEMP/bfme-verdict"
      - name: Check whether trusted base cache updated
        id: base_cache_check
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/bfme-base-cache/.updated" ]; then
            rm -f "$RUNNER_TEMP/bfme-base-cache/.updated"
            echo "save=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Save trusted base object cache
        if: steps.base_cache_check.outputs.save == 'yes'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: '${{ runner.temp }}/bfme-base-cache'
          key: bfme-base-obj-v1-n-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save capped structured verdict
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-verdict-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-verdict/verdict.json'
          if-no-files-found: error
          retention-days: 1
      - name: Save the bounded header layout receipt
        if: steps.compile.outputs.h5 == 'yes'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-header-h5-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-h5/header-h5.json'
          if-no-files-found: error
          retention-days: 1

      - name: Save advisory narrow virtual evidence
        continue-on-error: true
        if: vars.BFME_PR_COMPACT != 'yes' && steps.compile.outputs.inline_matrix_sha != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-inline-narrow-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-inline-narrow'
          if-no-files-found: error
          retention-days: 1

      - name: Evaluate narrow inline virtual behaviour using this receipt
        if: vars.BFME_PR_COMPACT == 'yes' && steps.compile.outputs.inline_matrix_sha != ''
        id: narrow-inline
        continue-on-error: true
        env:
          NARROW_SHA: '${{ steps.compile.outputs.inline_matrix_sha }}'
        shell: bash
        run: |
          set -euo pipefail
          test -z "${BFME_READ_TOKEN:-}${BFME_STATUS_TOKEN:-}${GITHUB_TOKEN:-}"
          dir="$RUNNER_TEMP/bfme-inline-narrow"
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C LC_ALL=C TMPDIR="$RUNNER_TEMP" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" BFME_INLINE_OWNER_SCOPE="$BFME_INLINE_OWNER_SCOPE" \
            BFME_PR_RUNNER="${BFME_PR_RUNNER:-}" \
            python3 -B ci/managed-check/managed_inline_action.py "$RUNNER_TEMP/bfme-plan/plan.json" \
              "$dir/matrix.json" "$dir" "$NARROW_SHA" "$RUNNER_TEMP/bfme-inline-report"

      - name: Keep sanitized narrow inline outcome
        if: vars.BFME_PR_COMPACT == 'yes' && steps.narrow-inline.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-inline-report-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-inline-report'
          if-no-files-found: error
          retention-days: 1

      - name: Probe declarations in the admitted narrow header trees
        id: h2_probe
        if: >-
          steps.compile.outcome == 'success' && vars.BFME_PR_COMPACT == 'yes' &&
          needs.intake.outputs.source_decision != '' &&
          fromJSON(needs.intake.outputs.source_decision).overall == 'success' &&
          (vars.BFME_AUTO_HEADERS == 'yes' ||
           (github.event_name == 'pull_request_target' && github.actor_id == '1760627' &&
            github.event.action == 'labeled' && github.event.label.name == 'boat-ok'))
        continue-on-error: true
        shell: bash
        env:
          BFME_H2_SOURCE: ${{ needs.intake.outputs.source_decision }}
        run: |
          set -euo pipefail
          if ! jq -e '.report.kind == "ok"' "$RUNNER_TEMP/bfme-verdict/verdict.json" >/dev/null ||
             ! jq -e '.changed_paths | any(startswith("include/"))' "$RUNNER_TEMP/bfme-plan/plan.json" >/dev/null; then
            exit 0
          fi
          printf 'attempted=yes\n' >> "$GITHUB_OUTPUT"
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C LC_ALL=C TMPDIR="$RUNNER_TEMP" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            BFME_H2_SOURCE="$BFME_H2_SOURCE" BFME_PR_RUNNER="${BFME_PR_RUNNER:-}" \
            /usr/bin/timeout --kill-after=5s 90s \
            python3 -B ci/managed-check/header_h2_action.py probe "$RUNNER_TEMP/bfme-plan" "$RUNNER_TEMP/bfme-h2"
          test -s "$RUNNER_TEMP/bfme-h2/header-h2.json"
          test "$(wc -c < "$RUNNER_TEMP/bfme-h2/header-h2.json")" -le 131072
          printf 'available=yes\n' >> "$GITHUB_OUTPUT"
      - name: Save the bounded declaration receipt
        id: h2_upload
        if: steps.h2_probe.outputs.available == 'yes'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-header-h2-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-h2/header-h2.json'
          if-no-files-found: error
          retention-days: 1
      - name: Produce bounded trusted header observations
