name: Measure protected main state
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.seed &&
      format('Seed protected main state {0}', github.sha) ||
      format('Measure protected main state {0}', github.sha) }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      seed:
        description: "Finish one protected baseline even if main advances"
        required: false
        type: boolean
        default: false
      recover_bootstrap:
        description: "Rejoin the retained first protected bootstrap without compiling"
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [bfme-landed]

permissions: {}

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch' && inputs.seed && 'bfme-protected-main-seed' ||
        github.event_name == 'repository_dispatch' &&
        (github.actor_id != '41898282' || github.event.client_payload.commit != github.sha ||
         github.event.client_payload.parent == '' || github.event.client_payload.head == '' ||
         github.event.client_payload.tree == '' || github.event.client_payload.number <= 0) &&
        format('bfme-state-unbound-dispatch-{0}', github.run_id) ||
        'bfme-protected-main-state' }}
  cancel-in-progress: '${{ github.event_name != ''workflow_dispatch'' || !inputs.seed }}'

env:
  BFME_STATE_SEED: '${{ github.event_name == ''workflow_dispatch'' && inputs.seed }}'
  # Which sealed compiler runner measures main; it selects the image pin in ci/managed-check/common.py.
  BFME_PR_RUNNER: '${{ vars.BFME_PR_RUNNER || '''' }}'

jobs:
  plan:
    if: >-
      inputs.recover_bootstrap != true && github.repository == 'Open-BFME/BFME2-Rebuild' &&
      github.ref == 'refs/heads/main' && vars.BFME_STATE_WORKFLOW_ENABLED == 'yes'
    runs-on: '${{ vars.BFME_STATE_CONTROL_RUNNER || ''ubuntu-24.04'' }}'
    timeout-minutes: 5
    permissions:
      contents: read
      # write: a routine refresh over the cap starts one seed run instead of leaving main unmeasured.
      actions: write
    outputs:
      # The plan step decides last: a refresh over the runner cap measures nothing (state_workflow.py).
      active: '${{ steps.plan.outputs.active == ''yes'' && ''yes'' || ''no'' }}'
      batches: '${{ steps.plan.outputs.batches }}'
      attempt: '${{ steps.plan.outputs.attempt }}'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
          fetch-depth: 0
      - name: Decide whether this current main needs measurement
        id: origin
        env:
          BFME_READ_TOKEN: '${{ github.token }}'
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected a valid protected state request. Found exit %s at line %s.\n" "$rc" "$LINENO" >&2' ERR
          (cd ci/managed-state && sha256sum -c --quiet bundle.sha256)
          python3 -B ci/managed-state/state_origin.py admit
      - name: Read an exact ancestor state
        if: steps.origin.outputs.active == 'yes' && env.BFME_STATE_SEED != 'true'
        env:
          BFME_READ_TOKEN: '${{ github.token }}'
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected the protected state step to finish. Found exit %s at line %s.\n" "$rc" "$LINENO" >&2' ERR
          (cd ci/managed-check && sha256sum -c --quiet bundle.sha256)
          (cd ci/managed-nt2 && sha256sum -c --quiet bundle.sha256)
          (cd ci/managed-state && sha256sum -c --quiet bundle.sha256)
          python3 -B ci/managed-state/state_fetch.py "$RUNNER_TEMP/previous-state.json" --parent
      - name: Build the exact protected main plan
        if: steps.origin.outputs.active == 'yes'
        id: plan
        env:
          STATE_BUDGET: '${{ vars.BFME_STATE_BUDGET_JOBS }}'
          STATE_SEED_BUDGET: '${{ vars.BFME_STATE_SEED_BUDGET_JOBS || ''64'' }}'
          BFME_READ_TOKEN: '${{ github.token }}'
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected the protected state step to finish. Found exit %s at line %s.\n" "$rc" "$LINENO" >&2' ERR
          (cd ci/managed-state && sha256sum -c --quiet bundle.sha256)
          (cd ci/managed-check && sha256sum -c --quiet bundle.sha256)
          python3 -B ci/managed-state/state_origin.py check
          unset BFME_READ_TOKEN
          mkdir "$RUNNER_TEMP/state-plan"
          python3 -B ci/managed-state/state_workflow.py plan "$RUNNER_TEMP/state-plan/state-plan.json" \
            "$RUNNER_TEMP/state-plan/carry.json" "$RUNNER_TEMP/previous-state.json"
          printf 'attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Start one seed run when this refresh is over the routine cap
        if: steps.plan.outputs.over_budget == 'yes' && env.BFME_STATE_SEED != 'true'
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected to start or find a seed run. Found exit %s at line %s.\n" "$rc" "$LINENO" >&2' ERR
          busy=$(gh run list -R "$GITHUB_REPOSITORY" --workflow state.yml --event workflow_dispatch --limit 50 \
            --json status,displayTitle \
            -q '[.[] | select(.status != "completed" and (.displayTitle | startswith("Seed protected main state ")))] | length')
          if [ "$busy" = 0 ]; then
            gh workflow run state.yml -R "$GITHUB_REPOSITORY" --ref main -f seed=true
            echo "::notice title=Seed started::Main needs a full refresh above the routine cap, so one seed run was started."
          else
            echo "::notice title=Seed already running::A seed run is already queued or running; not starting another."
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.plan.outputs.active == 'yes'
        with:
          name: bfme-state-plan-${{ github.run_attempt }}
          path: '${{ runner.temp }}/state-plan'
          retention-days: 1
          if-no-files-found: error

  measure:
    needs: plan
    if: needs.plan.outputs.active == 'yes'
    # The same sealed compiler runner the pull request checks use (vars.BFME_PR_RUNNER); Boat when unset.
    runs-on: '${{ vars.BFME_PR_RUNNER || ''boat-small/from=bfme2-compiler-v1'' }}'
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        batch: '${{ fromJSON(needs.plan.outputs.batches) }}'
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for runner filesystem hydration
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 90))
          runner_grace=$((SECONDS + 15))
          waited=0
          while true; do
            pending=$(awk '
              {
                for (i = 7; i <= NF - 2; i++) {
                  if ($i == "-") {
                    if ($(i + 1) ~ /^fuse(\.|$)/ && ($(i + 1) ~ /^fuse\.ascii-lazyfs(-|$)/ || $(i + 2) ~ /^ascii-lazyfs(-|$)/) && $5 !~ /^\/var\/lib\/ascii-lazy\/retired(\/|$)/) {
                      print $5
                    }
                    break
                  }
                }
              }
            ' /proc/self/mountinfo)
            if [ -z "$pending" ]; then
              if [ "$waited" -eq 1 ]; then
                printf 'Runner filesystem hydration finished after %ss.\n' "$SECONDS"
              fi
              exit 0
            fi
            home_dir="${HOME%/}"
            if [ -n "$home_dir" ] && [ "$pending" = "$home_dir" ] \
              && [ "${pending#/opt/boat-compiler}" = "$pending" ] \
              && [ "${pending#/var/}" = "$pending" ] \
              && [ "${pending#/usr}" = "$pending" ] \
              && [ "$SECONDS" -ge "$runner_grace" ]; then
              printf 'Proceeding after %ss with persistent lazy mount %s (all other mounts retired).\n' "$SECONDS" "$home_dir"
              exit 0
            fi
            waited=1
            if [ "$SECONDS" -ge "$deadline" ]; then
              printf 'Expected lazy runner mounts to retire within 90s; still mounted:\n%s\n' "$pending" >&2
              exit 1
            fi
            sleep 0.5
          done
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
      - name: Check current main before spending compiler time
        env:
          BFME_READ_TOKEN: '${{ github.token }}'
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected current protected main. Found exit %s at line %s.\n" "$rc" "$LINENO" >&2' ERR
          (cd ci/managed-state && sha256sum -c --quiet bundle.sha256)
          python3 -B ci/managed-state/state_origin.py check
      - name: Restore the exact protected plan with retry
        env:
          BFME_READ_TOKEN: '${{ github.token }}'
          BFME_STATE_PLAN_ATTEMPT: '${{ needs.plan.outputs.attempt }}'
        run: |
          set -euo pipefail
          (cd ci/managed-state && sha256sum -c --quiet bundle.sha256)
          python3 -B ci/managed-state/state_transport.py "$RUNNER_TEMP/state-input"
      - name: Verify the protected state and compiler package
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected the protected state step to finish. Found exit %s at line %s.\n" "$rc" "$LINENO" >&2' ERR
          (cd ci/managed-state && sha256sum -c --quiet bundle.sha256)
          (cd ci/managed-check && sha256sum -c --quiet bundle.sha256)
          (cd ci/managed-nt2 && sha256sum -c --quiet bundle.sha256)
          cd /opt/boat-compiler
          sudo -n sha256sum -c --quiet input.sha256 runtime-files.sha256
          sudo -n systemd-tmpfiles --create /etc/tmpfiles.d/boat-compiler.conf
      - name: Measure the assigned protected main translation units
        env:
          BATCH: '${{ matrix.batch }}'
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected the protected state step to finish. Found exit %s at line %s.\n" "$rc" "$LINENO" >&2' ERR
          test -z "${BFME_STATE_TOKEN:-}${GITHUB_TOKEN:-}"
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C LC_ALL=C             GITHUB_SHA="$GITHUB_SHA" TMPDIR="$RUNNER_TEMP" BFME_PR_RUNNER="${BFME_PR_RUNNER:-}"             python3 -B ci/managed-state/compare_main.py "$RUNNER_TEMP/state-input/state-plan.json"               "$BATCH" "$RUNNER_TEMP/state-shard-$BATCH.json" "$RUNNER_TEMP/base-shard-$BATCH.json"
      - name: Check current main before retaining shard results
        env:
          BFME_READ_TOKEN: '${{ github.token }}'
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected current protected main. Found exit %s at line %s.\n" "$rc" "$LINENO" >&2' ERR
          (cd ci/managed-state && sha256sum -c --quiet bundle.sha256)
          python3 -B ci/managed-state/state_origin.py check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-state-${{ needs.plan.outputs.attempt }}-shard-${{ matrix.batch }}-try-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/state-shard-${{ matrix.batch }}.json
            ${{ runner.temp }}/base-shard-${{ matrix.batch }}.json
          retention-days: 1
          if-no-files-found: error

  assemble:
    needs: [plan, measure]
    runs-on: '${{ vars.BFME_STATE_CONTROL_RUNNER || ''ubuntu-24.04'' }}'
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
      - name: Check current main before joining receipts
        env:
          BFME_READ_TOKEN: '${{ github.token }}'
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected current protected main. Found exit %s at line %s.\n" "$rc" "$LINENO" >&2' ERR
          (cd ci/managed-state && sha256sum -c --quiet bundle.sha256)
          python3 -B ci/managed-state/state_origin.py check
      - name: Restore exact plan and shard artifacts with retry
        env:
          BFME_READ_TOKEN: '${{ github.token }}'
          BFME_STATE_PLAN_ATTEMPT: '${{ needs.plan.outputs.attempt }}'
        run: |
          set -euo pipefail
          (cd ci/managed-state && sha256sum -c --quiet bundle.sha256)
          python3 -B ci/managed-state/state_transport.py "$RUNNER_TEMP/state-input" "$RUNNER_TEMP/state-shards"
      - name: Join the complete main state
        env:
          BFME_STATE_PLAN_ATTEMPT: '${{ needs.plan.outputs.attempt }}'
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected the protected state step to finish. Found exit %s at line %s.\n" "$rc" "$LINENO" >&2' ERR
          (cd ci/managed-state && sha256sum -c --quiet bundle.sha256)
          (cd ci/managed-check && sha256sum -c --quiet bundle.sha256)
          python3 -B ci/managed-state/state_workflow.py assemble "$RUNNER_TEMP/state-input/state-plan.json"             "$RUNNER_TEMP/state-shards" "$RUNNER_TEMP/state.json" "$RUNNER_TEMP/base-state.json" "$RUNNER_TEMP/state-input/carry.json"
      - name: Check current main before retaining the complete state
        env:
          BFME_READ_TOKEN: '${{ github.token }}'
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected current protected main. Found exit %s at line %s.\n" "$rc" "$LINENO" >&2' ERR
          (cd ci/managed-state && sha256sum -c --quiet bundle.sha256)
          python3 -B ci/managed-state/state_origin.py check
      - name: Retain exact protected base comparison receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-exact-main-state-${{ github.run_attempt }}
          path: '${{ runner.temp }}/base-state.json'
          if-no-files-found: error
          retention-days: 7
      - name: Retain the complete numeric main state
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-numeric-main-state-${{ github.run_attempt }}
          path: '${{ runner.temp }}/state.json'
          if-no-files-found: error
          retention-days: 7

  recover:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.recover_bootstrap && !inputs.seed &&
      github.repository == 'Open-BFME/BFME2-Rebuild' && github.repository_id == '1464323350' &&
      github.ref == 'refs/heads/main' && vars.BFME_STATE_WORKFLOW_ENABLED == 'yes'
    runs-on: '${{ vars.BFME_STATE_RECOVERY_RUNNER || ''ubuntu-24.04'' }}'
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for runner filesystem hydration
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 90))
          runner_grace=$((SECONDS + 15))
          waited=0
          while true; do
            pending=$(awk '
              {
                for (i = 7; i <= NF - 2; i++) {
                  if ($i == "-") {
                    if ($(i + 1) ~ /^fuse(\.|$)/ && ($(i + 1) ~ /^fuse\.ascii-lazyfs(-|$)/ || $(i + 2) ~ /^ascii-lazyfs(-|$)/) && $5 !~ /^\/var\/lib\/ascii-lazy\/retired(\/|$)/) {
                      print $5
                    }
                    break
                  }
                }
              }
            ' /proc/self/mountinfo)
            if [ -z "$pending" ]; then
              if [ "$waited" -eq 1 ]; then
                printf 'Runner filesystem hydration finished after %ss.\n' "$SECONDS"
              fi
              exit 0
            fi
            home_dir="${HOME%/}"
            if [ -n "$home_dir" ] && [ "$pending" = "$home_dir" ] \
              && [ "${pending#/opt/boat-compiler}" = "$pending" ] \
              && [ "${pending#/var/}" = "$pending" ] \
              && [ "${pending#/usr}" = "$pending" ] \
              && [ "$SECONDS" -ge "$runner_grace" ]; then
              printf 'Proceeding after %ss with persistent lazy mount %s (all other mounts retired).\n' "$SECONDS" "$home_dir"
              exit 0
            fi
            waited=1
            if [ "$SECONDS" -ge "$deadline" ]; then
              printf 'Expected lazy runner mounts to retire within 90s; still mounted:\n%s\n' "$pending" >&2
              exit 1
            fi
            sleep 0.5
          done
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
          fetch-depth: 8
      - name: Recover the original immutable measurement
        env:
          BFME_READ_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          (cd ci/managed-state && sha256sum -c --quiet bundle.sha256)
          (cd ci/managed-check && sha256sum -c --quiet bundle.sha256)
          python3 -B ci/managed-state/state_origin.py check
          python3 -B ci/managed-state/state_recover.py "$RUNNER_TEMP/recovery-input" "$RUNNER_TEMP/recovery"
          python3 -B ci/managed-state/state_origin.py check
      - name: Retain the exact protected comparison
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-exact-main-state-${{ github.run_attempt }}
          path: '${{ runner.temp }}/recovery/base-state.json'
          if-no-files-found: error
          retention-days: 7
      - name: Retain the protected numeric state
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-numeric-main-state-${{ github.run_attempt }}
          path: '${{ runner.temp }}/recovery/state.json'
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, measure, assemble, recover]
    if: >-
      always() && !cancelled() && github.repository_id == '1464323350' &&
      github.actor_id == '41898282' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch') &&
      (needs.assemble.result == 'success' || needs.recover.result == 'success' ||
       contains(needs.*.result, 'failure'))
    permissions:
      contents: write
      actions: read
      issues: write
    uses: ./.github/workflows/state-publish.yml
    with:
      measured_run_id: '${{ format(''{0}'', github.run_id) }}'
      measured_attempt: '${{ format(''{0}'', github.run_attempt) }}'
      measured_conclusion: >-
        ${{ (needs.assemble.result == 'success' || needs.recover.result == 'success') && 'success' || 'failure' }}

  catch-up:
    needs: [plan, assemble, publish]
    if: >-
      always() && !cancelled() && github.repository_id == '1464323350' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.seed &&
      needs.assemble.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: '${{ vars.BFME_STATE_CONTROL_RUNNER || ''ubuntu-24.04'' }}'
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
          fetch-depth: 1
      - name: Request one current-main refresh after protected seed completes
        env:
          BFME_READ_TOKEN: '${{ github.token }}'
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "Expected seed catch-up refresh to succeed. Found exit %s at line %s.\n" "$rc" "$LINENO" >&2' ERR
          (cd ci/managed-state && sha256sum -c --quiet bundle.sha256)
          python3 -B ci/managed-state/state_origin.py after-seed
